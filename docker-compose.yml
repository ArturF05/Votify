version: '3.8'

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  backend:
    build: .
    depends_on:
      - ollama
    environment:
      - Ollama__BaseUrl=http://ollama:11434
    ports:
      - "5000:80"

volumes:
  ollama_data:
